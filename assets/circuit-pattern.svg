<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="circuit" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Horizontal lines -->
      <line x1="0" y1="20" x2="100" y2="20" stroke="#0056b3" stroke-width="1" />
      <line x1="0" y1="50" x2="100" y2="50" stroke="#0056b3" stroke-width="1" />
      <line x1="0" y1="80" x2="100" y2="80" stroke="#0056b3" stroke-width="1" />
      
      <!-- Vertical lines -->
      <line x1="20" y1="0" x2="20" y2="100" stroke="#0056b3" stroke-width="1" />
      <line x1="50" y1="0" x2="50" y2="100" stroke="#0056b3" stroke-width="1" />
      <line x1="80" y1="0" x2="80" y2="100" stroke="#0056b3" stroke-width="1" />
      
      <!-- Connection points -->
      <circle cx="20" cy="20" r="3" fill="#0056b3" />
      <circle cx="50" cy="20" r="3" fill="#0056b3" />
      <circle cx="80" cy="20" r="3" fill="#0056b3" />
      <circle cx="20" cy="50" r="3" fill="#0056b3" />
      <circle cx="50" cy="50" r="3" fill="#0056b3" />
      <circle cx="80" cy="50" r="3" fill="#0056b3" />
      <circle cx="20" cy="80" r="3" fill="#0056b3" />
      <circle cx="50" cy="80" r="3" fill="#0056b3" />
      <circle cx="80" cy="80" r="3" fill="#0056b3" />
      
      <!-- Circuit components -->
      <rect x="35" y="35" width="30" height="30" rx="2" stroke="#0056b3" stroke-width="1" fill="none" />
      <path d="M65 35 L75 25 L85 35" stroke="#0056b3" stroke-width="1" fill="none" />
      <path d="M15 65 L25 75 L35 65" stroke="#0056b3" stroke-width="1" fill="none" />
      <path d="M65 65 Q75 55, 85 65" stroke="#0056b3" stroke-width="1" fill="none" />
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#circuit)" />
</svg>
