<!doctype html>

    <meta property="og:title" content="Events | IEEE NUCES PWR">
    <meta property="og:description" content="Browse IEEE NUCES PWR Student Branch events, workshops, competitions, and reports.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pwr.ieeenuces.org/events.html">
    <meta property="og:image" content="https://pwr.ieeenuces.org/assets/ieee-logo.png">
    <title>Events | IEEE NUCES PWR</title>
    <link rel="canonical" href="https://pwr.ieeenuces.org/events.html">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_io/favicon-32x32.png">
    <link rel="apple-touch-icon" href="assets/favicon_io/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <script src="assets/js/theme.js"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="assets/js/site-shell.js" defer></script>
    <script src="assets/js/site.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div data-site-header></div>
    <main id="main">
      <section class="page-hero">
        <img src="assets/events/2024/linkedin-brand/Pictures__Session_on_Building_Your_Personal_Brand__p1_img2.jpeg" alt="IEEE NUCES PWR branch activity" width="1400" height="720">
        <div class="page-hero-shade"></div>
        <div class="container page-hero-content">
          <p class="section-kicker">Events archive</p>
          <h1>Workshops, competitions, and branch sessions.</h1>
          <p>Browse documented IEEE NUCES PWR activities and event reports from 2023 onward.</p>
        </div>
      </section>

      <section class="section events-section">
        <div class="container section-heading section-heading-row">
          <div>
            <p class="section-kicker">Archive</p>
            <h2>Event records contributors can keep current.</h2>
          </div>
          <div class="filter-group" aria-label="Filter events">
            <button type="button" class="filter-button is-active" data-event-filter="all">All</button>
            <button type="button" class="filter-button" data-event-filter="2024">2024</button>
            <button type="button" class="filter-button" data-event-filter="2023">2023</button>
          </div>
        </div>
        <div class="container event-feature" id="event-feature"></div>
        <div class="container events-grid" id="events-grid" aria-live="polite"></div>
      </section>
    </main>
    <div data-site-footer></div>
  </body>
